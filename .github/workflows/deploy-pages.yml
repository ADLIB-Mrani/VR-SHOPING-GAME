name: Publier NOVA sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Tester et publier le showroom
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier le projet
        run: npm run check

      - name: Préparer les seuls fichiers publics
        run: |
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -R src styles _site/
          touch _site/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
