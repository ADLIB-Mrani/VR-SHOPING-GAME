name: NOVA storefront smoke tests
on:
  push:
    paths:
      - 'nova/**'
      - '.github/workflows/nova-smoke.yml'
  pull_request:
    paths:
      - 'nova/**'
      - '.github/workflows/nova-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test nova/smoke.test.mjs
