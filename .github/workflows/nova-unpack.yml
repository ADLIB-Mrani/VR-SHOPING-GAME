name: Unpack NOVA v2 source
on:
  push:
    branches: [feat/nova-vr-shop-v2]
    paths:
      - "nova-v2-bundle/part-05.b64"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore verified source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f nova-v2-bundle/part-05.b64
          cat nova-v2-bundle/part-{01,02,03,04,05}.b64 | base64 -d > /tmp/nova-v2.tar.xz
          echo "337d8bd146ed4bfa8c09d6f15712983432b4b45c2e9cde10701f8543fed8d810  /tmp/nova-v2.tar.xz" | sha256sum -c -
          tar -tf /tmp/nova-v2.tar.xz | grep -q '^\./index.html$'
          tar -xf /tmp/nova-v2.tar.xz
          rm -rf nova-v2-bundle
          rm -f .github/workflows/nova-unpack.yml
          npm run check
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "feat: restore NOVA immersive VR shopping v2 source"
            git push origin HEAD:feat/nova-vr-shop-v2
          fi
